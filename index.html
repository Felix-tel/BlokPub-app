

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAPTEL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
  text-align: center;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
}

.logo {
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 5px;
  margin-top: 20px;
}

.subtitle {
  color: #9ca3af;
  margin-bottom: 30px;
}

.panel {
  background: #1f2937;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 12px;
  font-weight: bold;
}

select, input, textarea {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  margin-bottom: 15px;
  font-size: 16px;
}

textarea {
  resize: vertical;
  min-height: 90px;
}

button {
  width: 100%;
  border: none;
  padding: 18px;
  margin: 8px 0;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.siren {
  background: #f97316;
  color: white;
}

.voice {
  background: #0d9488;
  color: white;
}

.stop {
  background: #dc2626;
  color: white;
  font-size: 24px;
}

.favorite {
  background: #374151;
  color: white;
}

.small {
  font-size: 13px;
  color: #9ca3af;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">ZAPTEL</div>
<div class="subtitle">C'est vous qui donnez le ton.</div>

<div class="panel">

<label for="sound">CHOISIR UNE ALERTE</label>

<select id="sound">
<option value="siren">Sirène</option>
<option value="alarm">Alarme</option>
<option value="buzzer">Buzzer</option>
<option value="funny">Humour</option>
</select>

<label>VOLUME</label>
<input type="range" id="volume" min="0" max="100" value="80">

<button class="siren" onclick="startSound()">
🚨 ACTIVER
</button>

</div>

<div class="panel">

<label>🗣️ MESSAGE VOCAL</label>

<textarea id="message" placeholder="Écrivez votre message ici..."></textarea>

<button class="voice" onclick="speakMessage()">
🗣️ PARLER
</button>

</div>

<div class="panel">

<label>⭐ MES 3 MESSAGES FAVORIS</label>

<input id="fav1" value="Attention ! Merci de vous calmer !">
<button class="favorite" onclick="speakFavorite(1)">
⭐ FAVORI 1
</button>

<input id="fav2" value="Stop ! Ce n'est pas acceptable !">
<button class="favorite" onclick="speakFavorite(2)">
⭐ FAVORI 2
</button>

<input id="fav3" value="Je vous demande de vous arrêter !">
<button class="favorite" onclick="speakFavorite(3)">
⭐ FAVORI 3
</button>

</div>

<button class="stop" onclick="stopAll()">
⛔ STOP
</button>

<p class="small">
ZAPTEL — Réagir en un instant.
</p>

</div>

<script>

let audioContext = null;
let oscillator = null;
let gainNode = null;
let soundInterval = null;

function stopSound() {
  if (soundInterval) {
    clearInterval(soundInterval);
    soundInterval = null;
  }

  if (oscillator) {
    try {
      oscillator.stop();
    } catch(e) {}

    oscillator = null;
  }

  if (audioContext) {
    try {
      audioContext.close();
    } catch(e) {}

    audioContext = null;
  }
}

function startSound() {

  stopAll();

  audioContext = new (window.AudioContext || window.webkitAudioContext)();

  gainNode = audioContext.createGain();
  gainNode.gain.value = document.getElementById("volume").value / 100;

  gainNode.connect(audioContext.destination);

  const type = document.getElementById("sound").value;

  oscillator = audioContext.createOscillator();
  oscillator.connect(gainNode);

  if (type === "buzzer") {
    oscillator.type = "square";
    oscillator.frequency.value = 180;
  }

  else if (type === "funny") {
    oscillator.type = "triangle";
    oscillator.frequency.value = 500;
  }

  else {
    oscillator.type = "sawtooth";
    oscillator.frequency.value = 700;
  }

  oscillator.start();

  if (type === "siren") {
    let high = true;

    soundInterval = setInterval(() => {
      if (!audioContext || !oscillator) return;

      oscillator.frequency.setValueAtTime(
        high ? 900 : 500,
        audioContext.currentTime
      );

      high = !high;
    }, 500);
  }

  else if (type === "alarm") {
    let high = true;

    soundInterval = setInterval(() => {
      if (!audioContext || !oscillator) return;

      oscillator.frequency.setValueAtTime(
        high ? 1000 : 300,
        audioContext.currentTime
      );

      high = !high;
    }, 300);
  }
}

function speakMessage() {

  const text = document.getElementById("message").value.trim();

  if (!text) {
    alert("Veuillez écrire un message.");
    return;
  }

  stopAll();

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.lang = "fr-FR";
  utterance.rate = 1.1;
  utterance.pitch = 1;
  utterance.volume = document.getElementById("volume").value / 100;

  speechSynthesis.speak(utterance);
}

function speakFavorite(number) {

  let text = document.getElementById("fav" + number).value.trim();

  if (!text) return;

  stopAll();

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.lang = "fr-FR";
  utterance.rate = 1.1;
  utterance.pitch = 1;
  utterance.volume = document.getElementById("volume").value / 100;

  speechSynthesis.speak(utterance);
}

function stopAll() {

  stopSound();

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
}

</script>

</body>
</html>
