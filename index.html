
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlokPub</title>
<style>
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 15px;
}
h1 {
  font-size: 36px;
  margin-top: 40px;
}
p {
  color: #aaa;
  font-size: 18px;
}
button {
  margin-top: 80px;
  width: 85%;
  max-width: 400px;
  height: 250px;
  border-radius: 30px;
  border: 5px solid #ff4444;
  background: linear-gradient(#ff3333, #990000);
  color: white;
  font-size: 38px;
  font-weight: bold;
  box-shadow: 0 10px 30px #600;
  cursor: pointer;
}
button:active {
  transform: scale(0.96);
}
</style>
</head>
<body>

<h1>🚫 BlokPub</h1>
<p>Un démarcheur vous appelle ?</p>

<button onclick="trident()">
  🔱<br>STOP PUB !<br>🔱
</button>

<p id="message"></p>

<script>
function trident() {
  const audio = new AudioContext();
  
  function tone(freq, start, duration, volume) {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(freq, audio.currentTime + start);
    osc.frequency.exponentialRampToValueAtTime(
      freq * 0.4,
      audio.currentTime + start + duration
    );
    
    gain.gain.setValueAtTime(volume, audio.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + start + duration
    );
    
    osc.connect(gain);
    gain.connect(audio.destination);
    
    osc.start(audio.currentTime + start);
    osc.stop(audio.currentTime + start + duration);
  }
  
  tone(880, 0, 0.8, 0.4);
  tone(440, 0.1, 1.2, 0.4);
  tone(220, 0.3, 1.5, 0.4);
  tone(110, 0.5, 1.7, 0.3);
  
  document.getElementById("message").innerText =
    "⚡ Votre réponse a été entendue ! ⚡";
}
</script>

</body>
</html>
