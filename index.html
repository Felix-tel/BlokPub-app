


<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAPTEL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

.container {
  max-width: 520px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 20px;
}

.logo {
  font-size: 40px;
  font-weight: bold;
  letter-spacing: 5px;
  color: #14b8a6;
}

.subtitle {
  color: #9ca3af;
  font-size: 14px;
  margin-top: 5px;
}

button, input, select, textarea {
  font-family: inherit;
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 18px 14px;
  margin: 8px 0;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.messageButton {
  background: #0d9488;
  color: white;
  min-height: 85px;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.sirenButton {
  background: #f97316;
  color: white;
  min-height: 72px;
}

.stopButton {
  background: #dc2626;
  color: white;
  min-height: 75px;
  font-size: 24px;
}

.configButton {
  background: #374151;
  color: white;
  font-size: 15px;
}

.panel {
  background: #1f2937;
  padding: 18px;
  border-radius: 16px;
  margin: 15px 0;
}

label {
  display: block;
  font-weight: bold;
  margin: 14px 0 8px;
}

input[type="text"], textarea, select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  background: white;
  color: #111827;
}

input[type="range"] {
  width: 100%;
}

.saveButton {
  background: #0d9488;
  color: white;
}

.backButton {
  background: #374151;
  color: white;
}

.hidden {
  display: none;
}

.small {
  color: #9ca3af;
  font-size: 13px;
  text-align: center;
  margin-top: 20px;
}

.sectionTitle {
  text-align: center;
  margin-bottom: 15px;
}

</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">ZAPTEL</div>
  <div class="subtitle">C'est vous qui donnez le ton.</div>
</header>

<!-- ÉCRAN INTERVENTION -->

<div id="mainScreen">

  <div class="panel">

    <button class="messageButton" id="btn1" onclick="speakFavorite(0)">
    </button>

    <button class="messageButton" id="btn2" onclick="speakFavorite(1)">
    </button>

    <button class="messageButton" id="btn3" onclick="speakFavorite(2)">
    </button>

  </div>

  <div class="panel">

    <label for="soundType">TYPE DE SIRÈNE</label>

    <select id="soundType">
      <option value="siren">Sirène</option>
      <option value="alarm">Alarme</option>
      <option value="buzzer">Buzzer</option>
      <option value="funny">Humour</option>
    </select>

    <label for="volume">VOLUME</label>

    <input type="range" id="volume" min="0" max="100" value="80">

    <button class="sirenButton" onclick="startSound()">
      🚨 SIRÈNE
    </button>

  </div>

  <button class="stopButton" onclick="stopAll()">
    ⛔ STOP
  </button>

  <button class="configButton" onclick="openConfig()">
    ⚙️ CONFIGURATION
  </button>

</div>

<!-- ÉCRAN CONFIGURATION -->

<div id="configScreen" class="hidden">

  <div class="panel">

    <h2 class="sectionTitle">⚙️ Configuration</h2>

    <label for="config1">Message vocal 1</label>
    <textarea id="config1"></textarea>

    <label for="config2">Message vocal 2</label>
    <textarea id="config2"></textarea>

    <label for="config3">Message vocal 3</label>
    <textarea id="config3"></textarea>

    <button class="saveButton" onclick="saveConfig()">
      💾 ENREGISTRER
    </button>

    <button class="backButton" onclick="closeConfig()">
      ↩ RETOUR
    </button>

  </div>

</div>

<footer class="small">
ZAPTEL — Réagir en un instant.
</footer>

</div>

<script>

// MESSAGES

let messages = [
  "Attention ! Veuillez vous calmer !",
  "Je vous demande de reculer !",
  "Cette situation est inacceptable !"
];

function loadMessages() {
  try {
    const saved = localStorage.getItem("zaptel_messages");

    if (saved) {
      const parsed = JSON.parse(saved);

      if (Array.isArray(parsed) && parsed.length === 3) {
        messages = parsed;
      }
    }
  } catch(e) {}

  updateButtons();
}

function updateButtons() {
  document.getElementById("btn1").textContent = messages[0];
  document.getElementById("btn2").textContent = messages[1];
  document.getElementById("btn3").textContent = messages[2];
}

function openConfig() {
  stopAll();

  document.getElementById("mainScreen").classList.add("hidden");
  document.getElementById("configScreen").classList.remove("hidden");

  document.getElementById("config1").value = messages[0];
  document.getElementById("config2").value = messages[1];
  document.getElementById("config3").value = messages[2];
}

function saveConfig() {

  messages = [
    document.getElementById("config1").value.trim(),
    document.getElementById("config2").value.trim(),
    document.getElementById("config3").value.trim()
  ];

  localStorage.setItem("zaptel_messages", JSON.stringify(messages));

  updateButtons();

  closeConfig();
}

function closeConfig() {
  document.getElementById("configScreen").classList.add("hidden");
  document.getElementById("mainScreen").classList.remove("hidden");
}

// VOIX

function speakFavorite(index) {

  const text = messages[index];

  if (!text) return;

  stopAll();

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.lang = "fr-FR";
  utterance.rate = 1.1;
  utterance.pitch = 1;
  utterance.volume = document.getElementById("volume").value / 100;

  speechSynthesis.speak(utterance);
}

// SIRENE

let audioContext = null;
let oscillator = null;
let gainNode = null;
let soundInterval = null;

function stopSound() {

  if (soundInterval) {
    clearInterval(soundInterval);
    soundInterval = null;
  }

  if (oscillator) {
    try {
      oscillator.stop();
    } catch(e) {}

    oscillator = null;
  }

  if (audioContext) {
    try {
      audioContext.close();
    } catch(e) {}

    audioContext = null;
  }
}

function startSound() {

  stopAll();

  audioContext = new (window.AudioContext || window.webkitAudioContext)();

  gainNode = audioContext.createGain();

  gainNode.gain.value = document.getElementById("volume").value / 100;

  gainNode.connect(audioContext.destination);

  const type = document.getElementById("soundType").value;

  oscillator = audioContext.createOscillator();
  oscillator.connect(gainNode);

  if (type === "buzzer") {
    oscillator.type = "square";
    oscillator.frequency.value = 180;
  }

  else if (type === "funny") {
    oscillator.type = "triangle";
    oscillator.frequency.value = 500;
  }

  else {
    oscillator.type = "sawtooth";
    oscillator.frequency.value = 700;
  }

  oscillator.start();

  if (type === "siren") {

    let high = true;

    soundInterval = setInterval(() => {

      if (!audioContext || !oscillator) return;

      oscillator.frequency.setValueAtTime(
        high ? 900 : 500,
        audioContext.currentTime
      );

      high = !high;

    }, 500);

  }

  else if (type === "alarm") {

    let high = true;

    soundInterval = setInterval(() => {

      if (!audioContext || !oscillator) return;

      oscillator.frequency.setValueAtTime(
        high ? 1000 : 300,
        audioContext.currentTime
      );

      high = !high;

    }, 300);

  }

}

// STOP GÉNÉRAL

function stopAll() {

  stopSound();

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
}

// INITIALISATION

loadMessages();
// MEMORISATION DU VOLUME
const volumeSlider = document.getElementById("volume");
volumeSlider.value = localStorage.getItem("zaptel_volume") || 80;
volumeSlider.addEventListener("input", function() {
  localStorage.setItem("zaptel_volume", this.value);
});
</script>

</body>
</html>
