
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAPTEL</title>

<style>
* { box-sizing: border-box; }

body {
  background: #10141c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px 15px;
  margin: 0;
}

.container {
  max-width: 500px;
  margin: auto;
}

h1 {
  font-size: 36px;
  margin-top: 25px;
  margin-bottom: 5px;
}

.subtitle {
  color: #9ba5b5;
  font-size: 15px;
  letter-spacing: 1px;
}

.quick {
  background: #202938;
  border: 1px solid #344154;
  padding: 18px;
  border-radius: 20px;
  margin-top: 30px;
}

.quick h2 {
  font-size: 18px;
  margin-top: 0;
}

button, select {
  font-size: 18px;
  border-radius: 14px;
  padding: 16px;
  cursor: pointer;
}

.quickbtn {
  width: 100%;
  background: #0d9488;
  border: none;
  color: white;
  font-weight: bold;
  margin-top: 10px;
}

#trigger {
  display: block;
  margin: 25px auto;
  width: 100%;
  height: 220px;
  background: linear-gradient(145deg, #ff4545, #9e1010);
  border: 4px solid #ff7777;
  border-radius: 30px;
  color: white;
  font-size: 32px;
  font-weight: bold;
  box-shadow: 0 0 25px rgba(255,40,40,0.3);
}

#trigger:active {
  transform: scale(0.98);
}

select {
  width: 100%;
  margin: 15px 0;
  background: #202938;
  color: white;
  border: 1px solid #45536a;
}

.volume {
  margin: 20px 0;
}

input[type=range] {
  width: 100%;
}

label {
  display: block;
  margin-bottom: 10px;
}

#stop {
  background: #252a32;
  color: white;
  border: 2px solid #777;
  width: 100%;
  font-size: 24px;
  font-weight: bold;
  padding: 20px;
  margin-top: 10px;
}

#message {
  margin-top: 25px;
  color: #b6c2d1;
  font-size: 17px;
}

.active {
  color: #ff6464 !important;
  font-weight: bold;
}

.footer {
  color: #677386;
  font-size: 12px;
  margin-top: 35px;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ ZAPTEL</h1>
<p class="subtitle">C'EST VOUS QUI DONNEZ LE TON.</p>

<div class="quick">
<h2>⚡ RÉPONSE RAPIDE</h2>
<button class="quickbtn" onclick="playSound()">
ACTIVER
</button>
</div>

<select id="sound">
  <option value="siren">🚨 Sirène</option>
  <option value="alarm">🔔 Alarme</option>
  <option value="buzzer">📢 Buzzer</option>
  <option value="funny">🤡 Son comique</option>
</select>

<div class="volume">
<label for="volume">🔊 Volume</label>
<input id="volume" type="range" min="0.1" max="1" step="0.1" value="0.7">
</div>

<button id="trigger" onclick="playSound()">
⚡<br>STOP PUB !<br>⚡
</button>

<button id="stop" onclick="stopSound()">
⏹ STOP
</button>

<p id="message">Prêt à riposter !</p>

<div class="footer">
ZAPTEL • Réponse immédiate
</div>

</div>

<script>

let audio = null;
let oscillators = [];
let active = false;
let loopTimer = null;

function stopSound() {

  active = false;

  if (loopTimer) {
    clearTimeout(loopTimer);
    loopTimer = null;
  }

  if (audio) {

    oscillators.forEach(o => {
      try { o.stop(); } catch(e) {}
    });

    oscillators = [];

    try { audio.close(); } catch(e) {}

    audio = null;
  }

  document.getElementById("message").innerText =
    "Son arrêté.";

  document.getElementById("message").classList.remove("active");
}

function tone(freq1, freq2, duration, type="sawtooth") {

  if (!audio || !active) return;

  const osc = audio.createOscillator();
  const gain = audio.createGain();

  const volume = Number(document.getElementById("volume").value);

  osc.type = type;

  osc.frequency.setValueAtTime(freq1, audio.currentTime);

  osc.frequency.linearRampToValueAtTime(
    freq2,
    audio.currentTime + duration
  );

  gain.gain.setValueAtTime(0.001, audio.currentTime);

  gain.gain.linearRampToValueAtTime(
    volume,
    audio.currentTime + 0.05
  );

  gain.gain.setValueAtTime(
    volume,
    audio.currentTime + duration - 0.05
  );

  gain.gain.linearRampToValueAtTime(
    0.001,
    audio.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime + duration);

  oscillators.push(osc);

  osc.onended = () => {
    oscillators = oscillators.filter(x => x !== osc);
  };
}

function playPattern(choice) {

  if (!active || !audio) return;

  if (choice === "siren") {
    tone(700, 1400, 0.45);
    tone(1400, 700, 0.45);
  }

  if (choice === "alarm") {
    tone(1200, 400, 0.35, "square");
    tone(400, 1200, 0.35, "square");
  }

  if (choice === "buzzer") {
    tone(150, 150, 0.5, "square");
  }

  if (choice === "funny") {
    tone(500, 1000, 0.25, "triangle");
    tone(1000, 300, 0.25, "triangle");
    tone(300, 800, 0.25, "triangle");
  }

  if (active) {
    loopTimer = setTimeout(() => {
      playPattern(choice);
    }, 500);
  }
}

async function playSound() {

  stopSound();

  audio = new (window.AudioContext || window.webkitAudioContext)();

  if (audio.state === "suspended") {
    await audio.resume();
  }

  active = true;

  const choice = document.getElementById("sound").value;

  document.getElementById("message").innerText =
    "⚠ ZAPTEL ACTIVÉ !";

  document.getElementById("message").classList.add("active");

  playPattern(choice);
}

document.getElementById("sound").addEventListener("change", () => {

  if (active) {
    playSound();
  }

});

</script>

</body>
</html>
